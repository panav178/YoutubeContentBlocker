<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouTube Content Blocker</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <div class="popup__title-row">
          <img src="../icons/icon32.png" alt="" width="24" height="24" class="popup__icon">
          <h1>YouTube Content Blocker</h1>
        </div>
        <p class="popup__subtitle">Hide distractions. Watch intentionally.</p>
      </header>

      <section class="popup__section popup__master">
        <label class="toggle toggle--master">
          <span class="toggle__label">Enable blocker</span>
          <input id="enabled" type="checkbox">
          <span class="toggle__switch"></span>
        </label>
      </section>

      <section class="popup__section popup__options" id="optionsSection">
        <label class="toggle">
          <span class="toggle__label">Hide home feed</span>
          <input id="hideHomeFeed" type="checkbox">
          <span class="toggle__switch"></span>
        </label>
        <label class="toggle">
          <span class="toggle__label">Hide sidebar recommendations</span>
          <input id="hideSidebarRecommendations" type="checkbox">
          <span class="toggle__switch"></span>
        </label>
        <label class="toggle">
          <span class="toggle__label">Hide Shorts</span>
          <input id="hideShorts" type="checkbox">
          <span class="toggle__switch"></span>
        </label>
        <label class="toggle">
          <span class="toggle__label">Hide comments</span>
          <input id="hideComments" type="checkbox">
          <span class="toggle__switch"></span>
        </label>
        <label class="toggle">
          <span class="toggle__label">Hide end-screen cards</span>
          <input id="hideEndscreen" type="checkbox">
          <span class="toggle__switch"></span>
        </label>
        <label class="toggle">
          <span class="toggle__label">Hide Explore / Trending</span>
          <input id="hideExplore" type="checkbox">
          <span class="toggle__switch"></span>
        </label>
        <label class="toggle">
          <span class="toggle__label">Show focus placeholders</span>
          <input id="replaceBlockedAreas" type="checkbox">
          <span class="toggle__switch"></span>
        </label>
      </section>

      <footer class="popup__footer">
        <span>v1.0.0</span>
        <span class="popup__dot">&middot;</span>
        <span>Open-source on GitHub</span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
